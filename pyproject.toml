[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "romtools"
dynamic = ["version", "long_description"]
long_description_content_type = "text/markdown"
requires-python = ">=3.8"
dependencies = [
    'docutils',
    'importlib-metadata',
    'numpy',
    'scipy',
    'matplotlib',
    'sphinx',
    'pydata-sphinx-theme',
    'sphinx-copybutton',
    'sphinx-design',
    'myst-nb',
    'jupyter-sphinx',
    'pytest==7.4.4',   # released Dec 31st, 2023
    'pytest-mpi>=0.6', # released Jan 8th, 2022
    'pytest-timeout',
]
# using pytest>=8.0.0 causes CI failures (likely compatibility issues with pytest-mpi)

[tool.setuptools.dynamic]
version = {file = "version.txt"}
long_description = {file = "README.md"}

[tool.setuptools.packages.find]
where = ["."]

#https://setuptools.pypa.io/en/latest/userguide/dependency_management.html#optional-dependencies
[project.optional-dependencies]
WithMPI = ['mpi4py>3.1.4']
WithH5py = ['h5py']
