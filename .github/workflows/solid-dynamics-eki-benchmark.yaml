name: solid-dynamics-eki-benchmark

on:
  pull_request:
    paths:
      - "examples/solid_dynamics_eki_mf_eki/**"
      - "examples/models/sparse_solid_dynamics.py"
      - "docs/source/demos/solid_dynamics_eki_mf_eki_demo.rst"
      - ".github/workflows/solid-dynamics-eki-benchmark.yaml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
      - name: Install romtools
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run full solid-dynamics EKI/MF-EKI benchmark
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          mkdir -p benchmark-results
          python - <<'PY' | tee benchmark-results/full_benchmark.log
          import sys

          sys.path.insert(0, "examples/models")
          from nonlinear_solid_dynamics import NonlinearSolid2D
          from sparse_solid_dynamics import (
              acceleration_sparse,
              solve_implicit_sparse,
          )

          NonlinearSolid2D.acceleration = acceleration_sparse

          def solve_without_line_search(self, *args, **kwargs):
              kwargs["line_search"] = False
              return solve_implicit_sparse(self, *args, **kwargs)

          NonlinearSolid2D.solve_implicit = solve_without_line_search

          sys.path.insert(0, "examples/solid_dynamics_eki_mf_eki")
          import example as benchmark

          original_run_eki = benchmark.run_eki
          original_run_mf_eki = benchmark.mf_eki_with_auto_rom

          def run_eki_parallel(*args, **kwargs):
              kwargs["evaluation_concurrency"] = 8
              return original_run_eki(*args, **kwargs)

          def run_mf_eki_parallel(*args, **kwargs):
              kwargs["fom_evaluation_concurrency"] = 8
              kwargs["rom_evaluation_concurrency"] = 8
              return original_run_mf_eki(*args, **kwargs)

          benchmark.run_eki = run_eki_parallel
          benchmark.mf_eki_with_auto_rom = run_mf_eki_parallel
          benchmark.main(
              smoke=False,
              work_dir="benchmark-work",
              output_dir="benchmark-results",
          )
          PY
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solid-dynamics-eki-benchmark-results
          path: benchmark-results
          if-no-files-found: warn
