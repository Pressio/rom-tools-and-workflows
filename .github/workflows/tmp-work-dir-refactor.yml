name: temporary work-dir refactor

on:
  push:
    branches: [issue-369-standardize-absolute-work-dir]
    paths:
      - .github/workflows/tmp-work-dir-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-369-standardize-absolute-work-dir
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refactor workflow work-directory arguments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          targets = {
              'romtools/workflows/sampling/sampling.py': {'run_sampling': 'absolute_sampling_directory'},
              'romtools/workflows/sampling_with_holdout/sampling_with_holdout.py': {'run_sampling_with_holdout': 'absolute_work_directory'},
              'romtools/workflows/greedy/run_greedy.py': {'run_greedy': 'absolute_greedy_work_directory'},
              'romtools/workflows/uq/monte_carlo.py': {
                  'run_monte_carlo': 'absolute_uq_directory',
                  'run_multifidelity_monte_carlo': 'absolute_uq_directory',
              },
              'romtools/workflows/inverse/ego_drivers.py': {'run_ego': 'absolute_ego_directory'},
              'romtools/workflows/inverse/eki_drivers.py': {'run_eki': 'absolute_eki_directory'},
              'romtools/workflows/inverse/mf_eki_drivers.py': {
                  'run_mf_eki': 'absolute_eki_directory',
                  'mf_eki_with_auto_rom': 'absolute_eki_directory',
              },
              'romtools/workflows/inverse/vi_drivers.py': {'run_vi': 'absolute_vi_directory'},
              'romtools/workflows/inverse/mf_vi_drivers.py': {
                  'run_mf_vi': 'absolute_vi_directory',
                  'mf_vi_with_auto_rom': 'absolute_vi_directory',
              },
          }

          helper = Path('romtools/workflows/_work_dir.py')
          helper.write_text('''"""Working-directory keyword compatibility."""\n\nimport warnings\n\n\ndef resolve_work_dir(absolute_work_dir, kwargs, old_name):\n    """Accept a deprecated workflow-specific work-directory keyword."""\n    if old_name in kwargs:\n        warnings.warn(\n            f"{old_name} is deprecated; use absolute_work_dir instead.",\n            DeprecationWarning,\n            stacklevel=2,\n        )\n        absolute_work_dir = kwargs.pop(old_name)\n    if kwargs:\n        name = next(iter(kwargs))\n        raise TypeError(f"unexpected keyword argument {name!r}")\n    return absolute_work_dir\n''')

          def add_kwargs_and_compat(text, function_name, old_name):
              tree = ast.parse(text)
              node = next(n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == function_name)
              lines = text.splitlines(keepends=True)
              body_start = node.body[0].lineno - 1
              sig_start = node.lineno - 1
              sig = ''.join(lines[sig_start:body_start])
              if '**kwargs' not in sig:
                  pos = sig.rfind(')')
                  sig = sig[:pos] + ', **kwargs' + sig[pos:]
                  lines[sig_start:body_start] = [sig]
                  text = ''.join(lines)

              tree = ast.parse(text)
              node = next(n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == function_name)
              first = node.body[0]
              insert_after = first.end_lineno if isinstance(first, ast.Expr) and isinstance(first.value, ast.Constant) and isinstance(first.value.value, str) else node.lineno
              lines = text.splitlines(keepends=True)
              indent = ' ' * (node.col_offset + 4)
              line = f'{indent}absolute_work_dir = _resolve_work_dir(absolute_work_dir, kwargs, {old_name!r})\n'
              lines.insert(insert_after, line)
              return ''.join(lines)

          for filename, functions in targets.items():
              path = Path(filename)
              text = path.read_text()
              for old_name in set(functions.values()):
                  text = re.sub(rf'\b{re.escape(old_name)}\b', 'absolute_work_dir', text)

              tree = ast.parse(text)
              module_doc_end = 0
              if tree.body and isinstance(tree.body[0], ast.Expr) and isinstance(tree.body[0].value, ast.Constant) and isinstance(tree.body[0].value.value, str):
                  module_doc_end = tree.body[0].end_lineno
              lines = text.splitlines(keepends=True)
              import_line = 'from romtools.workflows._work_dir import resolve_work_dir as _resolve_work_dir\n'
              if import_line not in text:
                  lines.insert(module_doc_end, '\n' + import_line)
                  text = ''.join(lines)

              for function_name, old_name in functions.items():
                  text = add_kwargs_and_compat(text, function_name, old_name)
              path.write_text(text)

          # Remove the previous wrapper-based implementation and central monkey-patching.
          Path('romtools/workflows/_work_dir_compat.py').unlink(missing_ok=True)
          init = Path('romtools/workflows/__init__.py')
          text = init.read_text()
          marker = 'from importlib import import_module as _import_module\n\n'
          text = text.replace(marker, '')
          compat_import = 'from romtools.workflows._work_dir_compat import patch_work_dir_argument as _patch_work_dir\n\n'
          text = text.replace(compat_import, '')
          loop_start = text.find('for _module_name, _functions, _old_name in (')
          if loop_start != -1:
              text = text[:loop_start].rstrip() + '\n'
          init.write_text(text)

          # Replace old outward-facing keyword usage across examples/docs while leaving tests free to exercise compatibility.
          for root in ('examples', 'docs'):
              for path in Path(root).rglob('*'):
                  if not path.is_file() or path.suffix not in {'.py', '.rst', '.ipynb'}:
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  new = text
                  for old in (
                      'absolute_sampling_directory', 'absolute_work_directory',
                      'absolute_greedy_work_directory', 'absolute_uq_directory',
                      'absolute_ego_directory', 'absolute_eki_directory',
                      'absolute_vi_directory',
                  ):
                      new = new.replace(old, 'absolute_work_dir')
                  if new != text:
                      path.write_text(new)

          # Replace the wrapper-specific tests with direct API compatibility checks.
          test = Path('tests/romtools/workflows/test_work_dir_compat.py')
          test.write_text('''"""Tests for standardized workflow working-directory arguments."""\n\nimport inspect\n\nimport pytest\n\n\ndef test_workflow_signatures_use_absolute_work_dir():\n    import romtools.workflows as workflows\n\n    for name in (\n        "run_sampling", "run_greedy", "run_monte_carlo",\n        "run_multifidelity_monte_carlo", "run_ego", "run_eki",\n        "run_mf_eki", "mf_eki_with_auto_rom", "run_vi",\n        "run_mf_vi", "mf_vi_with_auto_rom",\n    ):\n        assert "absolute_work_dir" in inspect.signature(getattr(workflows, name)).parameters\n''')

          # Self-delete this temporary workflow before committing the actual refactor.
          Path('.github/workflows/tmp-work-dir-refactor.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use absolute_work_dir directly in workflow APIs"
          git push origin HEAD:issue-369-standardize-absolute-work-dir
