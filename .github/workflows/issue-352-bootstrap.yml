name: Issue 352 bootstrap

on:
  push:
    branches:
      - fix-352-mf-eki-rom-substeps
    paths:
      - .github/workflows/issue-352-bootstrap.yml

permissions:
  contents: write

jobs:
  implement-test-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement ROM-only substeps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('romtools/workflows/inverse/mf_eki_drivers.py')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from romtools.workflows.inverse._inverse_utils import *\n',
              'from romtools.workflows.inverse._inverse_utils import *\n'
              'from romtools.workflows.inverse.eki_drivers import compute_eki_update\n',
          )

          helper = '''\n\ndef _validate_rom_substep_settings(rom_substep_start_iteration,\n                                   rom_substep_end_iteration,\n                                   num_rom_substeps):\n    if num_rom_substeps < 0:\n        raise ValueError("num_rom_substeps must be nonnegative")\n    if rom_substep_start_iteration < 0:\n        raise ValueError("rom_substep_start_iteration must be nonnegative")\n    if (rom_substep_end_iteration is not None\n            and rom_substep_end_iteration < rom_substep_start_iteration):\n        raise ValueError(\n            "rom_substep_end_iteration must be greater than or equal to "\n            "rom_substep_start_iteration"\n        )\n\n\ndef _rom_substeps_are_enabled(outer_iteration,\n                              rom_substep_start_iteration,\n                              rom_substep_end_iteration,\n                              num_rom_substeps):\n    if num_rom_substeps == 0:\n        return False\n    if outer_iteration < rom_substep_start_iteration:\n        return False\n    return (rom_substep_end_iteration is None\n            or outer_iteration < rom_substep_end_iteration)\n\n\ndef _apply_rom_only_substeps(rom_model,\n                             observations,\n                             observations_covariance,\n                             parameter_sample_sets,\n                             parameter_names,\n                             step_size,\n                             regularization_parameter,\n                             parameter_mins,\n                             parameter_maxes,\n                             absolute_eki_directory,\n                             outer_iteration,\n                             num_rom_substeps,\n                             rom_evaluation_concurrency,\n                             rom_dispatcher):\n    """Advance both MF-EKI sample sets with ROM-only single-fidelity EKI steps."""\n    first_set_size = parameter_sample_sets[0].shape[0]\n    combined_parameter_samples = np.vstack(parameter_sample_sets).copy()\n\n    for substep in range(num_rom_substeps):\n        run_directory_base = (\n            f'{absolute_eki_directory}/iteration_{outer_iteration}/'\n            f'rom_substep_{substep}/run_rom_'\n        )\n        rom_results = run_eki_iteration(\n            rom_model,\n            observations,\n            run_directory_base,\n            parameter_names,\n            combined_parameter_samples,\n            rom_evaluation_concurrency,\n            rom_dispatcher,\n        )\n        dp = compute_eki_update(\n            combined_parameter_samples,\n            rom_results['qois'],\n            rom_results['mean-qoi'],\n            rom_results['errors'],\n            observations_covariance,\n            regularization_parameter,\n        )\n        combined_parameter_samples = bound_samples(\n            combined_parameter_samples + step_size * dp,\n            parameter_mins,\n            parameter_maxes,\n        )\n        print(\n            f'  ROM-only substep {substep + 1}/{num_rom_substeps} after outer '\n            f'iteration {outer_iteration}, Delta p: {np.linalg.norm(dp):.5f}'\n        )\n\n    return [\n        combined_parameter_samples[:first_set_size].copy(),\n        combined_parameter_samples[first_set_size:].copy(),\n    ]\n'''
          replace_once('\ndef run_mf_eki(model: QoiModel,\n', helper + '\n\ndef run_mf_eki(model: QoiModel,\n')

          replace_once(
              '            max_rom_training_history: int = 1,\n'
              '            max_iterations: int = 50,\n',
              '            max_rom_training_history: int = 1,\n'
              '            rom_substep_start_iteration: int = 0,\n'
              '            rom_substep_end_iteration: Optional[int] = None,\n'
              '            num_rom_substeps: int = 0,\n'
              '            max_iterations: int = 50,\n',
          )

          replace_once(
              '        max_rom_training_history: Maximum number of accepted iterations whose\n'
              '            training data are retained for ROM rebuilding.\n'
              '        max_iterations: Maximum number of EKI iterations.\n',
              '        max_rom_training_history: Maximum number of accepted iterations whose\n'
              '            training data are retained for ROM rebuilding.\n'
              '        rom_substep_start_iteration: First outer MF-EKI iteration after which\n'
              '            ROM-only substeps may be applied.\n'
              '        rom_substep_end_iteration: Optional exclusive upper bound on outer\n'
              '            MF-EKI iterations that receive ROM-only substeps. ``None`` means\n'
              '            there is no upper bound.\n'
              '        num_rom_substeps: Number of ROM-only single-fidelity EKI updates to\n'
              '            apply after each enabled outer iteration. ``0`` preserves the\n'
              '            existing MF-EKI algorithm.\n'
              '        max_iterations: Maximum number of EKI iterations.\n',
          )

          replace_once(
              '    assert step_size_decay_factor > 1.0, "step_size_decay_factor must be greater than 1.0"\n',
              '    assert step_size_decay_factor > 1.0, "step_size_decay_factor must be greater than 1.0"\n'
              '    _validate_rom_substep_settings(\n'
              '        rom_substep_start_iteration, rom_substep_end_iteration, num_rom_substeps\n'
              '    )\n',
          )

          replace_once(
              '            rom_training_parameters=rom_training_parameters,\n'
              '            rom_training_qois=rom_training_qois\n'
              '        )\n'
              '    else:\n',
              '            rom_training_parameters=rom_training_parameters,\n'
              '            rom_training_qois=rom_training_qois,\n'
              '            rom_substep_start_iteration=rom_substep_start_iteration,\n'
              '            rom_substep_end_iteration=(-1 if rom_substep_end_iteration is None else rom_substep_end_iteration),\n'
              '            num_rom_substeps=num_rom_substeps\n'
              '        )\n'
              '    else:\n',
          )

          replace_once(
              '        iteration = restart_file[\'iteration\']\n'
              '        step_size = restart_file[\'step_size\']\n'
              '        training_dirs = restart_file[\'training_directories\'].tolist()\n',
              '        iteration = restart_file[\'iteration\']\n'
              '        step_size = restart_file[\'step_size\']\n'
              '        if \'num_rom_substeps\' in restart_file:\n'
              '            rom_substep_start_iteration = int(restart_file[\'rom_substep_start_iteration\'])\n'
              '            saved_end_iteration = int(restart_file[\'rom_substep_end_iteration\'])\n'
              '            rom_substep_end_iteration = None if saved_end_iteration < 0 else saved_end_iteration\n'
              '            num_rom_substeps = int(restart_file[\'num_rom_substeps\'])\n'
              '            _validate_rom_substep_settings(\n'
              '                rom_substep_start_iteration, rom_substep_end_iteration, num_rom_substeps\n'
              '            )\n'
              '        training_dirs = restart_file[\'training_directories\'].tolist()\n',
          )

          replace_once(
              '        for i in range(len(dps)):\n'
              '          test_parameter_sample_sets[i] = parameter_sample_sets[i] + step_size * dps[i]\n'
              '          test_parameter_sample_sets[i] = bound_samples(test_parameter_sample_sets[i],parameter_mins,parameter_maxes)\n\n'
              '        run_directory_base = f\'{absolute_eki_directory}/iteration_{iteration}/run_fom_sample_set_0_\'\n',
              '        for i in range(len(dps)):\n'
              '          test_parameter_sample_sets[i] = parameter_sample_sets[i] + step_size * dps[i]\n'
              '          test_parameter_sample_sets[i] = bound_samples(test_parameter_sample_sets[i],parameter_mins,parameter_maxes)\n\n'
              '        outer_iteration = iteration - 1\n'
              '        if _rom_substeps_are_enabled(\n'
              '                outer_iteration,\n'
              '                rom_substep_start_iteration,\n'
              '                rom_substep_end_iteration,\n'
              '                num_rom_substeps):\n'
              '            test_parameter_sample_sets = _apply_rom_only_substeps(\n'
              '                rom_model=rom_model,\n'
              '                observations=observations,\n'
              '                observations_covariance=observations_covariance,\n'
              '                parameter_sample_sets=test_parameter_sample_sets,\n'
              '                parameter_names=parameter_names,\n'
              '                step_size=step_size,\n'
              '                regularization_parameter=regularization_parameter,\n'
              '                parameter_mins=parameter_mins,\n'
              '                parameter_maxes=parameter_maxes,\n'
              '                absolute_eki_directory=absolute_eki_directory,\n'
              '                outer_iteration=outer_iteration,\n'
              '                num_rom_substeps=num_rom_substeps,\n'
              '                rom_evaluation_concurrency=rom_evaluation_concurrency,\n'
              '                rom_dispatcher=rom_dispatcher,\n'
              '            )\n\n'
              '        run_directory_base = f\'{absolute_eki_directory}/iteration_{iteration}/run_fom_sample_set_0_\'\n',
          )

          # The accepted-iteration restart save is the second occurrence of this tail.
          old_tail = (
              '                rom_training_parameters=rom_training_parameters,\n'
              '                rom_training_qois=rom_training_qois\n'
              '            )\n'
              '            iteration += 1\n'
          )
          new_tail = (
              '                rom_training_parameters=rom_training_parameters,\n'
              '                rom_training_qois=rom_training_qois,\n'
              '                rom_substep_start_iteration=rom_substep_start_iteration,\n'
              '                rom_substep_end_iteration=(-1 if rom_substep_end_iteration is None else rom_substep_end_iteration),\n'
              '                num_rom_substeps=num_rom_substeps\n'
              '            )\n'
              '            iteration += 1\n'
          )
          replace_once(old_tail, new_tail)

          replace_once(
              '                         max_rom_training_history: int = 1,\n'
              '                         max_iterations: int = 50,\n',
              '                         max_rom_training_history: int = 1,\n'
              '                         rom_substep_start_iteration: int = 0,\n'
              '                         rom_substep_end_iteration: Optional[int] = None,\n'
              '                         num_rom_substeps: int = 0,\n'
              '                         max_iterations: int = 50,\n',
          )

          replace_once(
              '        max_rom_training_history=max_rom_training_history,\n'
              '        max_iterations=max_iterations,\n',
              '        max_rom_training_history=max_rom_training_history,\n'
              '        rom_substep_start_iteration=rom_substep_start_iteration,\n'
              '        rom_substep_end_iteration=rom_substep_end_iteration,\n'
              '        num_rom_substeps=num_rom_substeps,\n'
              '        max_iterations=max_iterations,\n',
          )

          path.write_text(text)
          PY

      - name: Add tests
        shell: bash
        run: |
          cat > tests/romtools/workflows/inverse/test_mf_eki_rom_substeps.py <<'PY'
          import numpy as np
          import pytest

          import romtools.workflows.inverse.mf_eki_drivers as mf_module
          from romtools.workflows.parameter_spaces import MonteCarloSampler, UniformParameterSpace


          class LinearQoiModel:
              def populate_run_directory(self, run_directory, parameter_sample):
                  return None

              def run_model(self, run_directory, parameter_sample):
                  return 0

              def compute_qoi(self, run_directory, parameter_sample):
                  return np.array([parameter_sample["u"] + 0.5 * parameter_sample["v"]])


          class LinearQoiModelBuilder:
              def build_from_training_dirs(self, offline_data_dir, training_data_dirs,
                                           training_parameters, training_qois):
                  return LinearQoiModel()


          def _run_kwargs(directory):
              return {
                  "model": LinearQoiModel(),
                  "rom_model_builder": LinearQoiModelBuilder(),
                  "parameter_space": UniformParameterSpace(
                      ["u", "v"],
                      np.array([0.0, 0.0]),
                      np.array([1.0, 1.0]),
                      sampler=MonteCarloSampler,
                  ),
                  "observations": np.array([0.8]),
                  "observations_covariance": np.array([[1.0e-2]]),
                  "parameter_mins": np.array([0.0, 0.0]),
                  "parameter_maxes": np.array([1.0, 1.0]),
                  "absolute_eki_directory": str(directory),
                  "fom_ensemble_size": 4,
                  "rom_extra_ensemble_size": 4,
                  "rom_tolerance": np.inf,
                  "initial_step_size": 0.1,
                  "regularization_parameter": 1.0e-6,
                  "step_size_growth_factor": 1.1,
                  "step_size_decay_factor": 2.0,
                  "max_step_size_decrease_trys": 5,
                  "relaxation_parameter": 100.0,
                  "error_norm_tolerance": 0.0,
                  "delta_params_tolerance": 0.0,
                  "max_rom_training_history": 2,
                  "max_iterations": 4,
                  "random_seed": 3,
              }


          @pytest.mark.mpi_skip
          def test_rom_substep_window_predicate():
              assert not mf_module._rom_substeps_are_enabled(0, 1, 3, 2)
              assert mf_module._rom_substeps_are_enabled(1, 1, 3, 2)
              assert mf_module._rom_substeps_are_enabled(2, 1, 3, 2)
              assert not mf_module._rom_substeps_are_enabled(3, 1, 3, 2)
              assert mf_module._rom_substeps_are_enabled(100, 1, None, 2)
              assert not mf_module._rom_substeps_are_enabled(2, 0, None, 0)


          @pytest.mark.mpi_skip
          def test_rom_substeps_respect_bounds(monkeypatch):
              calls = []

              def fake_iteration(model, observations, run_directory_base, parameter_names,
                                 parameter_samples, evaluation_concurrency, dispatcher):
                  calls.append((run_directory_base, parameter_samples.copy()))
                  n = parameter_samples.shape[0]
                  return {
                      "qois": np.zeros((1, n)),
                      "mean-qoi": np.zeros(1),
                      "errors": np.ones((1, n)),
                  }

              def fake_update(parameter_samples, qois, mean_qoi, errors,
                              observations_covariance, regularization_parameter):
                  return np.ones_like(parameter_samples) * 10.0

              monkeypatch.setattr(mf_module, "run_eki_iteration", fake_iteration)
              monkeypatch.setattr(mf_module, "compute_eki_update", fake_update)

              result = mf_module._apply_rom_only_substeps(
                  rom_model=object(),
                  observations=np.array([0.0]),
                  observations_covariance=np.eye(1),
                  parameter_sample_sets=[
                      np.array([[0.2, 0.4], [0.5, 0.5]]),
                      np.array([[0.9, 0.1]]),
                  ],
                  parameter_names=["u", "v"],
                  step_size=1.0,
                  regularization_parameter=0.0,
                  parameter_mins=np.zeros(2),
                  parameter_maxes=np.ones(2),
                  absolute_eki_directory="/tmp/test-mf-eki-substeps",
                  outer_iteration=2,
                  num_rom_substeps=2,
                  rom_evaluation_concurrency=1,
                  rom_dispatcher=object(),
              )

              assert len(calls) == 2
              assert "/iteration_2/rom_substep_0/" in calls[0][0]
              assert "/iteration_2/rom_substep_1/" in calls[1][0]
              assert result[0].shape == (2, 2)
              assert result[1].shape == (1, 2)
              for sample_set in result:
                  assert np.all(sample_set >= 0.0)
                  assert np.all(sample_set <= 1.0)


          @pytest.mark.mpi_skip
          def test_num_rom_substeps_zero_reproduces_existing_behavior(tmp_path):
              baseline = mf_module.run_mf_eki(**_run_kwargs(tmp_path / "baseline"))
              explicit_zero = mf_module.run_mf_eki(
                  **_run_kwargs(tmp_path / "explicit_zero"),
                  rom_substep_start_iteration=1,
                  rom_substep_end_iteration=3,
                  num_rom_substeps=0,
              )
              assert np.array_equal(baseline[0], explicit_zero[0])
              assert np.array_equal(baseline[1], explicit_zero[1])


          @pytest.mark.mpi_skip
          def test_rom_substeps_only_run_in_requested_outer_window(monkeypatch, tmp_path):
              outer_iterations = []

              def fake_substeps(**kwargs):
                  outer_iterations.append(kwargs["outer_iteration"])
                  return [samples.copy() for samples in kwargs["parameter_sample_sets"]]

              monkeypatch.setattr(mf_module, "_apply_rom_only_substeps", fake_substeps)
              mf_module.run_mf_eki(
                  **_run_kwargs(tmp_path / "window"),
                  rom_substep_start_iteration=1,
                  rom_substep_end_iteration=3,
                  num_rom_substeps=2,
              )
              assert outer_iterations == [1, 2]


          @pytest.mark.mpi_skip
          def test_restart_restores_rom_substep_schedule(monkeypatch, tmp_path):
              outer_iterations = []

              def fake_substeps(**kwargs):
                  outer_iterations.append(kwargs["outer_iteration"])
                  return [samples.copy() for samples in kwargs["parameter_sample_sets"]]

              monkeypatch.setattr(mf_module, "_apply_rom_only_substeps", fake_substeps)
              first_kwargs = _run_kwargs(tmp_path / "restart")
              first_kwargs["max_iterations"] = 3
              mf_module.run_mf_eki(
                  **first_kwargs,
                  rom_substep_start_iteration=1,
                  rom_substep_end_iteration=4,
                  num_rom_substeps=1,
              )
              assert outer_iterations == [1]

              outer_iterations.clear()
              restart_path = tmp_path / "restart" / "iteration_2" / "restart.npz"
              restart_kwargs = _run_kwargs(tmp_path / "restart")
              restart_kwargs["max_iterations"] = 5
              mf_module.run_mf_eki(
                  **restart_kwargs,
                  restart_file=str(restart_path),
              )
              assert outer_iterations == [2, 3]


          @pytest.mark.mpi_skip
          def test_auto_rom_forwards_rom_substep_settings(monkeypatch):
              captured = {}

              def fake_run_mf_eki(**kwargs):
                  captured.update(kwargs)
                  return None, None

              monkeypatch.setattr(mf_module, "run_mf_eki", fake_run_mf_eki)
              parameter_space = UniformParameterSpace(
                  ["u", "v"],
                  np.zeros(2),
                  np.ones(2),
                  sampler=MonteCarloSampler,
              )
              mf_module.mf_eki_with_auto_rom(
                  model=LinearQoiModel(),
                  parameter_space=parameter_space,
                  observations=np.array([0.0]),
                  observations_covariance=np.eye(1),
                  rom_substep_start_iteration=2,
                  rom_substep_end_iteration=6,
                  num_rom_substeps=4,
              )
              assert captured["rom_substep_start_iteration"] == 2
              assert captured["rom_substep_end_iteration"] == 6
              assert captured["num_rom_substeps"] == 4
          PY

      - name: Add CDR benchmark
        shell: bash
        run: |
          mkdir -p benchmarks
          cat > benchmarks/issue_352_cdr.py <<'PY'
          """Benchmark issue #352 ROM-only MF-EKI substeps on the CDR regression problem."""

          import json
          import tempfile
          import time
          from pathlib import Path

          import numpy as np

          import romtools.workflows
          from tests.romtools.workflows.regression.inverse.cdr_regression_fixture import (
              build_mf_eki_kwargs,
          )


          class CountingModel:
              def __init__(self, model):
                  self.model = model
                  self.run_count = 0

              def populate_run_directory(self, run_directory, parameter_sample):
                  return self.model.populate_run_directory(run_directory, parameter_sample)

              def run_model(self, run_directory, parameter_sample):
                  self.run_count += 1
                  return self.model.run_model(run_directory, parameter_sample)

              def compute_qoi(self, run_directory, parameter_sample):
                  return self.model.compute_qoi(run_directory, parameter_sample)


          def run_case(root, name, num_substeps, start, end, max_iterations=10,
                       error_norm_tolerance=0.0):
              case_dir = root / name
              kwargs = build_mf_eki_kwargs(str(case_dir))
              counting_model = CountingModel(kwargs["model"])
              kwargs["model"] = counting_model
              kwargs["max_iterations"] = max_iterations
              kwargs["error_norm_tolerance"] = error_norm_tolerance
              kwargs["rom_substep_start_iteration"] = start
              kwargs["rom_substep_end_iteration"] = end
              kwargs["num_rom_substeps"] = num_substeps
              # Explicitly retain the requested auto-ROM GP normalization.
              kwargs["rom_type"] = "gp"
              kwargs["rom_args"] = dict(kwargs["rom_args"])
              kwargs["rom_args"]["normalize_parameters"] = True
              kwargs["rom_args"]["normalize_targets"] = True

              t0 = time.perf_counter()
              parameter_samples, qois = romtools.workflows.mf_eki_with_auto_rom(**kwargs)
              wall_time = time.perf_counter() - t0
              observations = kwargs["observations"]
              residual = float(np.mean(np.linalg.norm(observations[:, None] - qois, axis=0)))
              return {
                  "name": name,
                  "num_rom_substeps": num_substeps,
                  "start": start,
                  "end": end,
                  "fom_evaluations": counting_model.run_count,
                  "final_fom_residual": residual,
                  "wall_time_seconds": wall_time,
                  "parameter_mean": np.mean(parameter_samples, axis=0).tolist(),
              }


          def main():
              fixed_budget_cases = [
                  ("baseline", 0, 0, None),
                  ("s1_w0_4", 1, 0, 4),
                  ("s2_w0_4", 2, 0, 4),
                  ("s4_w0_4", 4, 0, 4),
                  ("s1_w0_6", 1, 0, 6),
                  ("s2_w0_6", 2, 0, 6),
                  ("s4_w0_6", 4, 0, 6),
                  ("s1_w2_6", 1, 2, 6),
                  ("s2_w2_6", 2, 2, 6),
                  ("s4_w2_6", 4, 2, 6),
              ]

              with tempfile.TemporaryDirectory(prefix="issue352-cdr-") as tmp:
                  root = Path(tmp)
                  fixed_budget = [
                      run_case(root / "fixed", *case, max_iterations=10)
                      for case in fixed_budget_cases
                  ]

                  baseline = fixed_budget[0]
                  # Use the baseline's 10-outer-iteration residual as a common quality target.
                  target = baseline["final_fom_residual"] * (1.0 + 1.0e-12)
                  time_to_quality = [
                      run_case(
                          root / "target",
                          f"{case[0]}_target",
                          case[1],
                          case[2],
                          case[3],
                          max_iterations=20,
                          error_norm_tolerance=target,
                      )
                      for case in fixed_budget_cases
                  ]

                  results = {
                      "benchmark": "romtools CDR MF-EKI auto-ROM",
                      "gp": {
                          "normalize_parameters": True,
                          "normalize_targets": True,
                      },
                      "fixed_budget_max_iterations": 10,
                      "baseline_quality_target": target,
                      "fixed_budget": fixed_budget,
                      "time_to_quality": time_to_quality,
                  }

              output = Path("/tmp/issue_352_cdr_benchmark.json")
              output.write_text(json.dumps(results, indent=2))
              print(json.dumps(results, indent=2))


          if __name__ == "__main__":
              main()
          PY

      - name: Syntax check
        run: python -m compileall -q romtools/workflows/inverse/mf_eki_drivers.py tests/romtools/workflows/inverse/test_mf_eki_rom_substeps.py benchmarks/issue_352_cdr.py

      - name: Install test dependencies
        run: python -m pip install -e . pytest

      - name: Run focused tests
        run: python -m pytest -q tests/romtools/workflows/inverse/test_mf_eki_rom_substeps.py tests/romtools/workflows/inverse/test_mf_eki_auto_rom.py

      - name: Run CDR benchmark
        run: python benchmarks/issue_352_cdr.py | tee /tmp/issue_352_cdr_benchmark.log

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-352-cdr-benchmark
          path: |
            /tmp/issue_352_cdr_benchmark.json
            /tmp/issue_352_cdr_benchmark.log

      - name: Commit implementation
        shell: bash
