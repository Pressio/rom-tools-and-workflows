name: Issue 352 parameter-error rerun 2

on:
  push:
    branches:
      - fix-352-mf-eki-rom-substeps

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-352-mf-eki-rom-substeps
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib pytest
      - name: Run CDR parameter-error benchmark
        run: |
          python benchmarks/issue_352_cdr.py > benchmarks/results/issue_352_cdr_benchmark.log
      - name: Commit benchmark figure and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-352-rerun-2.yml
          git add benchmarks/results/issue_352_cdr_benchmark.json \
                  benchmarks/results/issue_352_cdr_benchmark.log \
                  benchmarks/results/issue_352_parameter_error_vs_iteration.png \
                  .github/workflows/issue-352-rerun-2.yml
          git commit -m "Update issue 352 CDR benchmark for tighter viscosity range"
          git push origin HEAD:fix-352-mf-eki-rom-substeps
