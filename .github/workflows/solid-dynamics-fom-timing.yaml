name: solid-dynamics-fom-timing

on:
  pull_request:
    paths:
      - ".github/workflows/solid-dynamics-fom-timing.yaml"

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
      - name: Install romtools
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Time one production FOM evaluation
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import sys
          import time

          sys.path.insert(0, "examples/solid_dynamics_eki_mf_eki")
          import example as mod

          cfg = mod.configuration(False)
          model = mod.CantileverInverseQoiModel(cfg.fom, cfg.observation_times)
          start = time.perf_counter()
          qoi = model.evaluate_qoi(mod.transformed_sample(**mod.TRUTH))
          elapsed = time.perf_counter() - start
          print(f"PRODUCTION_FOM_SECONDS={elapsed:.6f}")
          print(f"QOI_NORM={float((qoi @ qoi) ** 0.5):.12e}")
          PY
