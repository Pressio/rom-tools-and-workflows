name: apply-vi-adam-driver-patch

on:
  push:
    branches:
      - feature-vi-mfvi-adam-natural-gradient
    paths:
      - helper_scripts/apply_vi_adam_driver_patch.py
      - .github/workflows/apply-vi-adam-driver-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-vi-mfvi-adam-natural-gradient
      - name: Patch VI and MF-VI drivers
        run: python helper_scripts/apply_vi_adam_driver_patch.py
      - name: Commit driver changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add romtools/workflows/inverse/vi_drivers.py romtools/workflows/inverse/mf_vi_drivers.py
          if git diff --cached --quiet; then
            echo "No driver changes needed"
            exit 0
          fi
          git commit -m "Integrate Adam directly into VI and MF-VI drivers"
          git push origin HEAD:feature-vi-mfvi-adam-natural-gradient
